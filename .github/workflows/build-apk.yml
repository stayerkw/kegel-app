name: بناء تطبيق أندرويد (APK)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      production:
        description: 'إصدار إنتاجي لمتجر Google Play (يتطلب مفتاح التوقيع الدائم)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Android SDK (مثبّت مسبقًا على خادم البناء)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          ls "$ANDROID_HOME/build-tools" | tail -3

      - name: تثبيت الحزم
        run: npm install --no-audit --no-fund

      - name: إنشاء مشروع أندرويد
        run: |
          cp node_modules/@capacitor/core/dist/capacitor.js www/capacitor.js
          npx cap add android

      - name: الأيقونة وشاشة البداية (من تصميم كانفا)
        run: |
          npx @capacitor/assets generate --android \
            --iconBackgroundColor '#0B3A3A' --iconBackgroundColorDark '#0B3A3A' \
            --splashBackgroundColor '#0B3A3A' --splashBackgroundColorDark '#0B3A3A'
          mkdir -p android/app/src/main/res/drawable
          cp assets/ic_stat_notify.png android/app/src/main/res/drawable/ic_stat_notify.png

      - name: الأذونات (إشعارات، اهتزاز، إعادة الجدولة بعد إعادة التشغيل)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          for P in POST_NOTIFICATIONS RECEIVE_BOOT_COMPLETED VIBRATE WAKE_LOCK USE_BIOMETRIC; do
            grep -q "android.permission.$P\"" $M || sed -i "s#</manifest>#    <uses-permission android:name=\"android.permission.$P\" />\n</manifest>#" $M
          done
          cat $M

      - name: الويدجت والروابط العميقة (vigoris://)
        run: python3 native/inject.py android/app/src/main

      - name: الحد الأدنى لأندرويد 8 (مطلوب لـ Health Connect)
        run: |
          sed -i 's/minSdkVersion = [0-9]*/minSdkVersion = 26/' android/variables.gradle
          grep -n "SdkVersion" android/variables.gradle

      - name: رقم الإصدار
        run: |
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
          grep -n "version" android/app/build.gradle

      - name: المزامنة والبناء
        run: |
          npx cap sync android
          cd android && chmod +x gradlew && ./gradlew assembleRelease bundleRelease --no-daemon
          grep -n "targetSdkVersion" variables.gradle || true

      - name: فحص جاهزية المتجر
        env:
          PROD: ${{ github.event.inputs.production == 'true' }}
        run: |
          # كل بند غير مؤشَّر في PLAY_CHECKLIST.md يظهر تنبيهًا في نسخة المتجر
          OPEN=$(grep -c '^- \[ \]' PLAY_CHECKLIST.md || true)
          if [ "$PROD" = "true" ] && [ "$OPEN" -gt 0 ]; then
            grep '^- \[ \]' PLAY_CHECKLIST.md | sed 's/^- \[ \] //; s/\*\*//g; s/`//g' | cut -c1-300 | while read -r L; do
              echo "::warning title=قبل النشر على Google Play::$L"
            done
            { echo "## قبل النشر على Google Play: $OPEN بند مفتوح"; grep '^- \[ \]' PLAY_CHECKLIST.md; } >> $GITHUB_STEP_SUMMARY
          fi

      - name: التوقيع
        env:
          KS_B64: ${{ secrets.KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          PROD: ${{ github.event.inputs.production == 'true' }}
        run: |
          # الإصدار الإنتاجي لا يُوقّع أبدًا بمفتاح مؤقت: يتوقف البناء بوضوح إن غاب المفتاح الدائم
          if [ "$PROD" = "true" ] && [ -z "$KS_B64" ]; then
            echo "::error::إصدار إنتاجي بلا مفتاح توقيع دائم. أضف KEYSTORE_B64 وKEYSTORE_PASSWORD في Settings > Secrets ثم أعد التشغيل."
            exit 1
          fi
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          IN=android/app/build/outputs/apk/release/app-release-unsigned.apk
          $BT/zipalign -p -f 4 $IN aligned.apk
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > release.jks
            $BT/apksigner sign --ks release.jks --ks-key-alias kegel --ks-pass env:KS_PASS --key-pass env:KS_PASS --out kegel.apk aligned.apk
          else
            echo "::warning::نسخة اختبار: لا يوجد مفتاح توقيع دائم — يُستخدم مفتاح مؤقت (التحديث يتطلب إزالة التطبيق). لا تُنشر هذه النسخة في المتجر."
            echo "TEST_KEY=1" >> $GITHUB_ENV
            keytool -genkeypair -keystore tmp.jks -alias kegel -keyalg RSA -keysize 2048 -validity 36500 -storepass tmppass -dname "CN=tmp"
            $BT/apksigner sign --ks tmp.jks --ks-key-alias kegel --ks-pass pass:tmppass --out kegel.apk aligned.apk
          fi
          $BT/apksigner verify kegel.apk && ls -la kegel.apk
          # حزمة Google Play (AAB) — تُوقّع فقط بالمفتاح الدائم، فمفتاح الرفع لا يجوز أن يتغير
          if [ -n "$KS_B64" ]; then
            jarsigner -keystore release.jks -storepass "$KS_PASS" -keypass "$KS_PASS" -sigalg SHA256withRSA -digestalg SHA-256 \
              -signedjar vigoris.aab android/app/build/outputs/bundle/release/app-release.aab kegel
            ls -la vigoris.aab
          fi

      - name: نشر الإصدار للتحميل من الجوال
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Vigoris 1.0.${{ github.run_number }}${{ env.TEST_KEY == '1' && ' — نسخة اختبار (مفتاح مؤقت)' || '' }}
          body: |
            ${{ env.TEST_KEY == '1' && 'نسخة اختبار موقّعة بمفتاح مؤقت — للتجربة على جوالك فقط، وليست للنشر في المتجر.' || 'موقّعة بالمفتاح الدائم.' }}
            حمّل ملف kegel.apk على جوال أندرويد وثبّته (اسمح بالتثبيت من مصادر غير معروفة عند الطلب).
            رابط آخر إصدار دائمًا: https://github.com/${{ github.repository }}/releases/latest/download/kegel.apk
          files: |
            kegel.apk
            vigoris.aab
          fail_on_unmatched_files: false
          make_latest: true

name: بناء تطبيق أندرويد (APK)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: تثبيت الحزم
        run: npm install --no-audit --no-fund

      - name: إنشاء مشروع أندرويد
        run: |
          cp node_modules/@capacitor/core/dist/capacitor.js www/capacitor.js
          npx cap add android

      - name: الأيقونة وشاشة البداية (من تصميم كانفا)
        run: |
          npx @capacitor/assets generate --android \
            --iconBackgroundColor '#0F766E' --iconBackgroundColorDark '#0F766E' \
            --splashBackgroundColor '#0F766E' --splashBackgroundColorDark '#0F766E'
          mkdir -p android/app/src/main/res/drawable
          cp assets/ic_stat_notify.png android/app/src/main/res/drawable/ic_stat_notify.png

      - name: الأذونات (إشعارات دقيقة، اهتزاز، إعادة الجدولة بعد إعادة التشغيل)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          for P in POST_NOTIFICATIONS SCHEDULE_EXACT_ALARM RECEIVE_BOOT_COMPLETED VIBRATE WAKE_LOCK; do
            grep -q "android.permission.$P\"" $M || sed -i "s#</manifest>#    <uses-permission android:name=\"android.permission.$P\" />\n</manifest>#" $M
          done
          cat $M

      - name: رقم الإصدار
        run: |
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
          grep -n "version" android/app/build.gradle

      - name: المزامنة والبناء
        run: |
          npx cap sync android
          cd android && chmod +x gradlew && ./gradlew assembleRelease --no-daemon

      - name: التوقيع
        env:
          KS_B64: ${{ secrets.KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          IN=android/app/build/outputs/apk/release/app-release-unsigned.apk
          $BT/zipalign -p -f 4 $IN aligned.apk
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > release.jks
            $BT/apksigner sign --ks release.jks --ks-key-alias kegel --ks-pass env:KS_PASS --key-pass env:KS_PASS --out kegel.apk aligned.apk
          else
            echo "::warning::لا يوجد مفتاح توقيع في الأسرار — يُستخدم مفتاح مؤقت (التحديثات ستتطلب إزالة التطبيق)"
            keytool -genkeypair -keystore tmp.jks -alias kegel -keyalg RSA -keysize 2048 -validity 36500 -storepass tmppass -dname "CN=tmp"
            $BT/apksigner sign --ks tmp.jks --ks-key-alias kegel --ks-pass pass:tmppass --out kegel.apk aligned.apk
          fi
          $BT/apksigner verify kegel.apk && ls -la kegel.apk

      - name: نشر الإصدار للتحميل من الجوال
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: قوة الحوض 1.0.${{ github.run_number }}
          body: |
            حمّل ملف kegel.apk على جوال أندرويد وثبّته (اسمح بالتثبيت من مصادر غير معروفة عند الطلب).
            رابط آخر إصدار دائمًا: https://github.com/${{ github.repository }}/releases/latest/download/kegel.apk
          files: kegel.apk
          make_latest: true

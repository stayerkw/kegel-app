<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0F766E">
<title>قوة الحوض — تمارين كيجل</title>
<style>
:root{
  --bg:#F6F4EF;--card:#FFFFFF;--ink:#1C2321;--muted:#6B7470;--line:#E6E2D9;
  --accent:#0F766E;--accent2:#14B8A6;--accentSoft:#DDF1EE;--warn:#B45309;--warnSoft:#FEF3C7;
  --danger:#B91C1C;--ok:#15803D;--relax:#94A3B8;
  --r:18px;--safeT:env(safe-area-inset-top,0px);--safeB:env(safe-area-inset-bottom,0px);
}
body.dark{--bg:#0F1413;--card:#18201E;--ink:#ECF1EF;--muted:#9AA6A2;--line:#26302D;--accentSoft:#12332F;--warnSoft:#3A2A0D;--relax:#64748B}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;font-size:16px;line-height:1.6;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
#app{max-width:520px;margin:0 auto;min-height:100%;padding:calc(14px + var(--safeT)) 16px calc(92px + var(--safeB))}
#app.full{padding-bottom:calc(20px + var(--safeB))}
h1{font-size:24px;margin:4px 0 2px}h2{font-size:19px;margin:18px 0 10px}h3{font-size:16px;margin:0 0 6px}
p{margin:6px 0}.muted{color:var(--muted)}.small{font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:12px 0}
.btn{display:block;width:100%;padding:15px;border-radius:14px;background:var(--ink);color:var(--bg);font-weight:700;font-size:17px;text-align:center}
.btn.accent{background:var(--accent);color:#fff}.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.sm{padding:10px;font-size:15px;display:inline-block;width:auto;min-width:96px}
.btn:active{transform:scale(.98)}
.row{display:flex;gap:10px;align-items:center}.row>*{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--accentSoft);color:var(--accent);font-weight:600;font-size:14px}
body.dark .chip{color:#5EEAD4}
.stat{text-align:center;padding:12px}.stat b{display:block;font-size:24px;font-variant-numeric:tabular-nums}
.pbar{height:8px;background:var(--line);border-radius:9px;overflow:hidden}.pbar i{display:block;height:100%;background:var(--accent);border-radius:9px;transition:width .4s}
.tabs{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 6px calc(6px + var(--safeB));z-index:5}
.tabs[hidden]{display:none}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;font-size:12px;color:var(--muted);padding:6px 0;gap:2px}
.tabs button.on{color:var(--accent);font-weight:700}
.tabs svg{width:24px;height:24px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:start;padding:14px;border:1.5px solid var(--line);border-radius:14px;margin:8px 0;background:var(--card)}
.opt.on{border-color:var(--accent);background:var(--accentSoft)}
.opt .box{width:22px;height:22px;border-radius:7px;border:2px solid var(--line);flex:0 0 22px;display:grid;place-items:center}
.opt.on .box{background:var(--accent);border-color:var(--accent)}
.opt.on .box::after{content:"";width:5px;height:10px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:translateY(-1px) rotate(45deg)}
.dots{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--line)}.dots i.on{background:var(--accent)}.dots i.cur{background:var(--accent2);transform:scale(1.25)}
.steps{display:flex;gap:6px;margin:4px 0 18px}.steps i{flex:1;height:5px;border-radius:5px;background:var(--line)}.steps i.on{background:var(--accent)}
.warn{background:var(--warnSoft);border:1px solid #F59E0B55;color:var(--ink);border-radius:14px;padding:12px 14px;margin:10px 0;font-size:14px}
.warn b{color:var(--warn)}
.illu{width:100%;height:auto;display:block;border-radius:14px;background:var(--accentSoft);margin:6px 0 10px}
.flip{perspective:900px;margin:10px 0}
.flip .in{position:relative;transition:transform .5s;transform-style:preserve-3d;min-height:150px}
.flip.on .in{transform:rotateY(180deg)}
.flip .f,.flip .b{position:absolute;inset:0;backface-visibility:hidden;border-radius:16px;padding:16px;border:1px solid var(--line);background:var(--card);display:flex;flex-direction:column;justify-content:center}
.flip .b{transform:rotateY(180deg);background:var(--accentSoft)}
.ring-wrap{position:relative;width:240px;height:240px;margin:8px auto}
.ring-wrap svg{transform:rotate(-90deg)}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.count{font-size:56px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.phase{font-size:26px;font-weight:800;text-align:center;margin:6px 0 0}
.hint{text-align:center;color:var(--muted);min-height:48px;margin:4px 12px}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.iconbtn{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--card);border:1px solid var(--line)}
.bars{display:flex;align-items:flex-end;gap:8px;height:130px;padding-top:8px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.bars span{width:100%;max-width:30px;background:var(--accent);border-radius:8px 8px 3px 3px;min-height:3px}
.bars span.zero{background:var(--line)}
.bars small{font-size:11px;color:var(--muted)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.ach{text-align:center;padding:12px 6px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-size:12px}
.ach .e{display:grid;place-items:center;width:44px;height:44px;margin:0 auto 6px;border-radius:14px;background:var(--accentSoft);color:var(--accent)}
.ach .e svg{width:24px;height:24px}.ach.off{opacity:.45}.ach.off .e{background:var(--line);color:var(--muted)}
body.dark .ach .e{color:#5EEAD4}
.set{display:flex;align-items:center;justify-content:space-between;padding:13px 0;border-bottom:1px solid var(--line);gap:10px}
.set:last-child{border-bottom:0}
.sw{width:50px;height:30px;border-radius:30px;background:var(--line);position:relative;flex:0 0 50px;transition:.2s}
.sw::after{content:"";position:absolute;top:3px;right:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px #0003}
.sw.on{background:var(--accent)}.sw.on::after{right:23px}
input[type=time]{font:inherit;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.modal{position:fixed;inset:0;background:#0007;display:flex;align-items:flex-end;justify-content:center;z-index:20;padding:16px}
.modal .sheet{background:var(--card);border-radius:22px;padding:20px;width:100%;max-width:480px;margin-bottom:var(--safeB)}
details{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:10px 0;padding:0 14px}
details summary{padding:14px 0;font-weight:700;cursor:pointer;list-style:none}
details summary::after{content:"＋";float:left;color:var(--muted)}details[open] summary::after{content:"－"}
details>div{padding-bottom:14px;color:var(--ink)}
.toast{position:fixed;bottom:calc(96px + var(--safeB));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;font-size:14px;z-index:30;max-width:90%}
.big-check{width:104px;height:104px;border-radius:50%;background:var(--accentSoft);display:grid;place-items:center;margin:30px auto 10px;position:relative}
.big-check path{stroke-dasharray:1;stroke-dashoffset:1;animation:draw .7s .15s cubic-bezier(.16,1,.3,1) forwards}
.big-check::before{content:"";position:absolute;inset:-10px;border-radius:50%;border:2px solid var(--accent2);opacity:0;animation:ripple 1.1s .2s cubic-bezier(.16,1,.3,1)}
@keyframes ripple{0%{opacity:.7;transform:scale(.8)}100%{opacity:0;transform:scale(1.35)}}
::selection{background:var(--accent);color:#fff}
html{caret-color:var(--accent);scrollbar-color:var(--line) transparent}
.ic{width:20px;height:20px;flex:0 0 auto;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-4px}
.ic.lg{width:28px;height:28px}.ic.xl{width:40px;height:40px}
.ic-badge{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:12px;background:var(--accentSoft);color:var(--accent);margin-bottom:8px}
body.dark .ic-badge{color:#5EEAD4}
.hrow{display:flex;align-items:center;gap:8px}
.btn .ic{margin-inline-end:6px}
.flame{color:#EA580C}
@keyframes draw{to{stroke-dashoffset:0}}
.illu .lift{animation:lift 4.4s cubic-bezier(.45,0,.55,1) infinite}
@keyframes lift{0%,18%{transform:translateY(0)}45%,62%{transform:translateY(-12px)}90%,100%{transform:translateY(0)}}
.illu .breathe{transform-box:fill-box;transform-origin:50% 100%;animation:breathe 4.4s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}
.illu .air{animation:air 4.4s ease-in-out infinite}
@keyframes air{0%,40%{opacity:0;transform:translateX(6px)}60%{opacity:.9}100%{opacity:0;transform:translateX(-10px)}}
.illu .vib{transform-box:fill-box;transform-origin:center;animation:vib 1.8s cubic-bezier(.16,1,.3,1) infinite}
@keyframes vib{0%{opacity:0;transform:scale(.85)}25%{opacity:1}100%{opacity:0;transform:scale(1.15)}}
.illu .shake{transform-box:fill-box;transform-origin:center;animation:shake 1.8s infinite}
@keyframes shake{0%,8%,16%,100%{transform:translateX(0)}4%{transform:translateX(-1.5px)}12%{transform:translateX(1.5px)}}
.illu .glow{animation:glow 4.4s ease-in-out infinite}
@keyframes glow{0%,18%,90%,100%{opacity:.25}45%,62%{opacity:.9}}
.wave{display:block;width:100%;height:auto;margin:8px 0 2px}
.wave .w{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.4s cubic-bezier(.16,1,.3,1) forwards}
.wave .a{opacity:0;animation:fadein .6s .7s forwards}
@keyframes fadein{to{opacity:1}}
.live{display:block;margin:-6px auto 0;width:260px;max-width:100%;height:auto}
.live .hm{transition:d .12s linear}.live .org{transition:transform .12s linear}
#ring{transition:stroke-dashoffset .1s linear,stroke .3s}
.ring-wrap.beat{animation:beat .35s cubic-bezier(.16,1,.3,1)}
@keyframes beat{0%{transform:scale(1)}40%{transform:scale(1.03)}100%{transform:scale(1)}}
.confetti{position:fixed;left:50%;top:150px;width:0;height:0;pointer-events:none;z-index:25}
.confetti i{position:absolute;width:8px;height:12px;border-radius:2px;opacity:0;animation:burst 1.5s cubic-bezier(.16,1,.3,1) forwards}
@keyframes burst{0%{opacity:1;transform:translate(0,0) rotate(0)}100%{opacity:0;transform:translate(var(--x),var(--y)) rotate(var(--r))}}
.cups{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 12px;color:var(--accent)}
.cups svg{width:24px;height:30px}.cups .lv{fill:var(--accent2);opacity:0;transform:scaleY(0);transform-origin:50% 100%;transform-box:fill-box;transition:transform .45s cubic-bezier(.16,1,.3,1),opacity .2s}
.cups .full .lv{opacity:.85;transform:scaleY(1)}
.cups svg:not(.full){color:var(--line)}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;background:var(--accentSoft);color:var(--accent);margin-inline-start:6px;font-weight:600}
select{font:inherit;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.credit{display:flex;align-items:center;justify-content:center;gap:8px;margin:18px 0 6px;color:var(--muted);font-size:13px}
.credit b{color:var(--ink)}
@media (prefers-reduced-motion:reduce){
  .illu .lift,.illu .breathe,.illu .air,.illu .vib,.illu .shake,.ring-wrap.beat,.flip .in{animation:none!important;transition:none!important}
  .illu .glow{animation:none;opacity:.6}.confetti{display:none}
  .wave .w,.big-check path{animation:none;stroke-dashoffset:0}.wave .a{animation:none;opacity:1}
}
.center{text-align:center}
.rate{display:flex;gap:8px}.rate button{flex:1;padding:12px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);font-weight:600}
.rate button.on{border-color:var(--accent);background:var(--accentSoft)}
</style>

<body>
<div id="app"></div>
<script src="capacitor.js" onerror="void 0"></script>
<nav class="tabs" id="tabs" hidden></nav>
<script>
"use strict";
/* ============ أدوات المنصة (Capacitor عند التشغيل كتطبيق، وإلا المتصفح) ============ */
const Cap = window.Capacitor;
const isNative = !!(Cap && Cap.isNativePlatform && Cap.isNativePlatform());
const plug = n => { if(!isNative) return null; if(Cap.registerPlugin) return Cap.registerPlugin(n); return (Cap.Plugins&&Cap.Plugins[n])||null; };
const LN = plug('LocalNotifications'), HP = plug('Haptics'), APP = plug('App'), KA = plug('KeepAwake'), WB = plug('WidgetBridge');

const Haptic = {
  heavy(){ if(!S.haptics) return; if(HP) HP.impact({style:'HEAVY'}).catch(()=>{}); else vib(70); },
  light(){ if(!S.haptics) return; if(HP) HP.impact({style:'LIGHT'}).catch(()=>{}); else vib(18); },
  double(){ if(!S.haptics) return; if(HP){HP.impact({style:'LIGHT'}).catch(()=>{});setTimeout(()=>HP.impact({style:'LIGHT'}).catch(()=>{}),140);} else vib([25,90,25]); },
  success(){ if(!S.haptics) return; if(HP) HP.notification({type:'SUCCESS'}).catch(()=>{}); else vib([20,50,20]); },
  long(){ if(!S.haptics) return; if(HP){HP.vibrate({duration:180}).catch(()=>{});setTimeout(()=>HP.vibrate({duration:180}).catch(()=>{}),360);setTimeout(()=>HP.vibrate({duration:260}).catch(()=>{}),720);} else vib([180,180,180,180,260]); }
};
function vib(p){ try{ navigator.vibrate && navigator.vibrate(p); }catch(e){} }
async function keepAwake(on){
  try{ if(KA){ on?await KA.keepAwake():await KA.allowSleep(); return; } }catch(e){}
  try{ if(on && navigator.wakeLock){ window._wl = await navigator.wakeLock.request('screen'); } else if(window._wl){ window._wl.release(); window._wl=null; } }catch(e){}
}
function speak(t){
  if(!S.voice || !window.speechSynthesis) return;
  try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(t); u.lang='ar-SA'; u.rate=1; speechSynthesis.speak(u);}catch(e){}
}

/* ============ التخزين ============ */
const KEY='kegel_v1';
const DEF={v:1,onboarded:false,goals:[],level:1,reminders:['07:00','13:00','21:00'],remindersOn:true,haptics:true,voice:false,dark:false,
  progDay:1,dayDoneOn:null,logs:[],ach:{},suggestAdvance:false,warned:false,startDate:null,smartRem:true,water:null,waterLog:{}};
const defWater=()=>({on:true,goal:8,ml:250,from:'08:00',to:'22:00',every:120});
let S;
try{ S=Object.assign({},DEF,JSON.parse(localStorage.getItem(KEY)||'{}')); }catch(e){ S=Object.assign({},DEF); }
function fixState(){ if(!S.water) S.water=defWater(); if(!S.waterLog) S.waterLog={}; if(S.smartRem===undefined) S.smartRem=true; }
fixState();
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){} }

/* ============ التاريخ ============ */
const pad=n=>String(n).padStart(2,'0');
const dstr=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>dstr(new Date());
const addDays=(s,n)=>{const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return dstr(d);};
const dayDiff=(a,b)=>Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/864e5);
const AR_DAYS=['أحد','إثنين','ثلاثاء','أربعاء','خميس','جمعة','سبت'];

/* ============ البرنامج: 180 يومًا ============ */
const PHASES=[
  {n:1,name:'الإحساس',from:1,to:14,goal:'عزل العضلة وبناء العادة'},
  {n:2,name:'البناء',from:15,to:42,goal:'قوة أساسية'},
  {n:3,name:'التثبيت',from:43,to:70,goal:'تحويل العادة إلى روتين'},
  {n:4,name:'القوة',from:71,to:105,goal:'انقباضات أطول'},
  {n:5,name:'السيطرة',from:106,to:140,goal:'ألياف سريعة وبطيئة'},
  {n:6,name:'التحمّل',from:141,to:180,goal:'صيانة طويلة الأمد'}
];
const lerp=(a,b,t)=>Math.round(a+(b-a)*t);
function phaseOf(day){ return PHASES.find(p=>day>=p.from&&day<=p.to)||PHASES[5]; }
function planFor(day){
  day=Math.min(Math.max(day,1),180);
  const ph=phaseOf(day), t=(day-ph.from)/Math.max(1,ph.to-ph.from);
  let reps,sq,rl,n,patterns;
  switch(ph.n){
    case 1: reps=lerp(5,8,t);sq=3;rl=3;n=2;patterns=['classic','classic'];break;
    case 2: reps=lerp(8,12,t);sq=lerp(4,6,t);rl=4;n=3;patterns=['classic','steps','classic'];break;
    case 3: reps=10;sq=6;rl=6;n=3;patterns=['classic','classic',(day%7===0)?'rapid':'classic'];break;
    case 4: reps=10;sq=lerp(8,10,t);rl=8;n=3;patterns=['classic','classic','hold'];break;
    case 5: reps=12;sq=10;rl=10;n=3;patterns=['elevator','rapid','classic'];break;
    default:{reps=lerp(10,15,t);sq=10;rl=10;n=3;const all=['classic','elevator','hold','steps','rapid'];patterns=[0,1,2].map(i=>all[(day+i)%all.length]);}
  }
  const week=Math.floor((day-1)/7)+1, light=(week%4===0);
  if(light){ sq=Math.max(3,Math.round(sq*0.7)); rl=Math.max(3,Math.round(rl*0.8)); }
  const holdSec = ph.n===4 ? lerp(15,25,t) : 25;
  return {day,phase:ph,reps,sq,rl,n,patterns,light,holdSec};
}
const PAT_NAME={classic:'كلاسيكي',steps:'السلّم',rapid:'النيران السريعة',hold:'الثبات الطويل',elevator:'المصعد'};

/* بناء الجدول الزمني للجلسة */
function buildSession(kind,plan,idx){
  const steps=[]; let reps, title, pattern;
  const add=(t,d,rep,lbl)=>steps.push({t,d,rep,lbl});
  if(kind==='quick'){ pattern='classic'; reps=6; title='جلسة سريعة — دقيقة واحدة';
    for(let r=1;r<=reps;r++){add('sq',5,r);add('rl',5,r);} }
  else if(kind==='rapidq'){ pattern='rapid'; reps=30; title='النيران السريعة — 60 ثانية';
    for(let r=1;r<=reps;r++){add('sq',1,r);add('rl',1,r);} }
  else{
    pattern=plan.patterns[idx]||'classic'; title='جلسة '+(idx+1)+' من '+plan.n+' — '+PAT_NAME[pattern];
    if(pattern==='classic'){ reps=plan.reps; for(let r=1;r<=reps;r++){add('sq',plan.sq,r);add('rl',plan.rl,r);} }
    else if(pattern==='steps'){ reps=Math.max(3,Math.ceil(plan.reps/2)); for(let r=1;r<=reps;r++){[1,2,3,2,1].forEach(s=>{add('sq',s,r);add('rl',2,r);});} }
    else if(pattern==='rapid'){ reps=30; for(let r=1;r<=reps;r++){add('sq',1,r);add('rl',1,r);} }
    else if(pattern==='hold'){ reps=3; for(let r=1;r<=reps;r++){add('sq',plan.holdSec,r,'hold');add('rl',15,r);} }
    else if(pattern==='elevator'){ reps=Math.max(4,Math.round(plan.reps/2)); for(let r=1;r<=reps;r++){add('e1',3,r);add('e2',3,r);add('e3',3,r);add('rl',plan.rl,r);} }
  }
  steps.unshift({t:'ready',d:3,rep:0});
  const total=steps.reduce((a,s)=>a+s.d,0);
  return {kind,idx,pattern,reps,title,steps,total};
}
function sessionMinutes(plan,idx){ return Math.max(1,Math.round(buildSession('daily',plan,idx).total/60)); }

/* ============ منطق اليوم والسلسلة ============ */
function rollover(){
  const t=today();
  if(!S.startDate) S.startDate=t;
  if(S.dayDoneOn && S.dayDoneOn<t){
    if(S.progDay<180) S.progDay++;
    S.dayDoneOn=null;
  }
  save();
}
const logsOn=d=>S.logs.filter(l=>l.date===d);
const dailyDoneOn=d=>logsOn(d).filter(l=>l.kind==='daily'&&!l.skipped).length;
function streakDates(){
  const set=new Set();
  const byDate={};
  S.logs.forEach(l=>{ if(l.skipped) return; (byDate[l.date]=byDate[l.date]||[]).push(l); });
  Object.keys(byDate).forEach(d=>{ const L=byDate[d]; if(L.some(l=>l.kind==='quick'||l.kind==='rapidq') || L.some(l=>l.dayComplete)) set.add(d); });
  return set;
}
function streak(){
  const set=streakDates(); let d=today(), c=0;
  if(!set.has(d)) d=addDays(d,-1);
  while(set.has(d)){ c++; d=addDays(d,-1); }
  return c;
}
function bestStreak(){
  const arr=[...streakDates()].sort(); let best=0,cur=0,prev=null;
  arr.forEach(d=>{ cur=(prev&&dayDiff(prev,d)===1)?cur+1:1; best=Math.max(best,cur); prev=d; });
  return best;
}
const totalReps=()=>S.logs.filter(l=>!l.skipped).reduce((a,l)=>a+(l.reps||0),0);

const totalSessions=()=>S.logs.filter(l=>!l.skipped).length;
function lastActiveBeforeToday(){ const ds=[...streakDates()].filter(d=>d<today()).sort(); return ds.length?ds[ds.length-1]:null; }

function msgFor(dayNo,slot){
  if(slot===0){
    if(dayNo===10) return ['تشعر بفرق؟','كن صبورًا — النتائج تظهر عادة خلال 4–8 أسابيع.'];
    if(dayNo===21) return ['أنت في اليوم 21','أغلب من يصلون إلى هنا يكملون البرنامج.'];
    if(dayNo===45) return ['يوم 45 — راجع إنجازاتك','افتح التقدم وشاهد كم قطعت.'];
  }
  if(slot===2) return ['جلسة دقيقة واحدة تحفظ سلسلتك','لم تكمل يومك بعد؟ دقيقة واحدة تكفي.'];
  return MSGS[slot];
}

/* التذكير الذكي: يتعلّم وقت كل جلسة من آخر 21 يومًا ويذكّرك قبله بعشر دقائق */
function learnedSlots(){
  const need=planFor(S.progDay).n, map=need===2?[0,2]:[0,1,2], by={}, cut=addDays(today(),-21), slots=[[],[],[]];
  S.logs.filter(l=>l.kind==='daily'&&!l.skipped&&l.date>=cut).forEach(l=>(by[l.date]=by[l.date]||[]).push(l.ts));
  Object.values(by).forEach(a=>a.sort((x,y)=>x-y).slice(0,need).forEach((ts,i)=>{ const t=new Date(ts); slots[map[i]].push(t.getHours()*60+t.getMinutes()); }));
  return slots;
}
function effectiveTimes(){
  const sl=S.smartRem?learnedSlots():[[],[],[]];
  return S.reminders.map((t,i)=>{
    const a=sl[i].slice().sort((x,y)=>x-y);
    if(a.length<4) return {t,learned:false};
    let m=a[Math.floor(a.length/2)]-10; m=Math.max(0,Math.round(m/5)*5);
    return {t:pad(Math.floor(m/60))+':'+pad(m%60),learned:true};
  });
}
const WMSG=[['وقت كوب ماء','كوب الآن يحافظ على نشاطك وصحة مثانتك.'],['اشرب كوبًا من الماء','الترطيب المنتظم يقلل تهيّج المثانة.'],['استراحة ماء','كوب واحد الآن يقرّبك من هدفك اليومي.'],['لا تنسَ الماء','وزّع شربك على اليوم بدل كمية كبيرة مرة واحدة.']];

function waterSlots(){ const [fh,fm]=S.water.from.split(':').map(Number),[th,tm]=S.water.to.split(':').map(Number), out=[]; for(let m=fh*60+fm;m<=th*60+tm;m+=S.water.every) out.push(m); return out; }
let _rs; function reschedule(){ clearTimeout(_rs); _rs=setTimeout(scheduleReminders,1200); }
let _typesDone=false;
async function scheduleReminders(){
  if(!LN) return;
  try{
    const pend=await LN.getPending();
    if(pend.notifications.length) await LN.cancel({notifications:pend.notifications.map(n=>({id:n.id}))});
    try{ await LN.createChannel({id:'training',name:'تذكير التمارين',importance:5,vibration:true}); }catch(e){}
    try{ await LN.createChannel({id:'water',name:'تذكير شرب الماء',importance:4,vibration:true}); }catch(e){}
    if(!_typesDone){ try{ await LN.registerActionTypes({types:[{id:'WATER',actions:[{id:'drink',title:'شربت كوبًا'}]},{id:'TRAIN',actions:[{id:'start',title:'ابدأ الآن'}]}]}); _typesDone=true; }catch(e){} }
    const now=new Date(), list=[], tdone=dailyDoneOn(today()), need=planFor(S.progDay).n, times=effectiveTimes();
    if(S.remindersOn) for(let i=0;i<14;i++){
      times.forEach(({t},slot)=>{
        if(need===2 && slot===1) return;
        const [h,m]=t.split(':').map(Number);
        const at=new Date(now.getFullYear(),now.getMonth(),now.getDate()+i,h,m,0);
        if(at<=now) return;
        if(i===0 && (S.dayDoneOn===today() || tdone>(need===2&&slot===2?1:slot))) return;
        const [title,body]=msgFor(Math.min(180,S.progDay+i),slot);
        list.push({id:1000+i*10+slot,title,body,schedule:{at,allowWhileIdle:true},channelId:'training',smallIcon:'ic_stat_notify',actionTypeId:'TRAIN',extra:{go:'session'}});
      });
    }
    if(S.water.on){ const ws=waterSlots(); for(let i=0;i<7;i++) ws.forEach((mins,k)=>{
      const at=new Date(now.getFullYear(),now.getMonth(),now.getDate()+i,Math.floor(mins/60),mins%60,0);
      if(at<=now) return;
      if(i===0 && waterToday()>=S.water.goal) return;
      const [title,body]=WMSG[(i+k)%WMSG.length];
      const b2 = i===0 ? `شربت ${waterToday()} من ${S.water.goal} أكواب اليوم. ${body}` : body;
      list.push({id:5000+i*40+k,title,body:b2,schedule:{at,allowWhileIdle:true},channelId:'water',smallIcon:'ic_stat_notify',actionTypeId:'WATER',extra:{go:'water'}});
    }); }
    if(list.length) await LN.schedule({notifications:list});
  }catch(e){ console.log('notif err',e); }
}

/* موجة شكل التمرين: مستوى الانقباض عبر الزمن */
function wave(pat,w=300,h=58){
  const P={
    classic:[[0,0],[1,0],[1,1],[4,1],[4,0],[7,0],[7,1],[10,1],[10,0],[13,0],[13,1],[16,1],[16,0],[19,0]],
    steps:(()=>{let a=[[0,0]],t=0.5;[1,2,3,2,1].forEach(d=>{a.push([t,0],[t,1],[t+d,1],[t+d,0]);t+=d+1;});a.push([t,0]);return a;})(),
    rapid:(()=>{let a=[[0,0]];for(let i=0;i<10;i++){const t=0.5+i*1.8;a.push([t,0],[t,1],[t+.9,1],[t+.9,0]);}a.push([18.5,0]);return a;})(),
    hold:[[0,0],[1.5,0],[1.5,1],[14,1],[14,0],[19,0]],
    elevator:[[0,0],[1,0],[1,.34],[4,.34],[4,.67],[7,.67],[7,1],[10,1],[10,0],[11.5,0],[11.5,.34],[13.5,.34],[13.5,.67],[15.5,.67],[15.5,1],[17.5,1],[17.5,0],[19,0]]
  }[pat]||[];
  const maxT=Math.max(...P.map(q=>q[0])), pad=4;
  const X=t=>pad+(w-2*pad)*t/maxT, Y=l=>h-pad-(h-2*pad-4)*l;
  const d='M'+P.map(([t,l])=>X(t).toFixed(1)+' '+Y(l).toFixed(1)).join(' L');
  return `<svg class="wave" viewBox="0 0 ${w} ${h}" aria-hidden="true" style="transform:scaleX(-1)">
    <line x1="${pad}" y1="${h-pad}" x2="${w-pad}" y2="${h-pad}" stroke="var(--line)" stroke-width="1.5"/>
    <path class="a" d="${d} L${X(maxT)} ${h-pad} Z" fill="var(--accentSoft)"/>
    <path class="w" pathLength="1" d="${d}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/></svg>`;
}

function confetti(){
  if(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const c=document.createElement('div'); c.className='confetti';
  const cols=['#0F766E','#14B8A6','#5EEAD4','#C9B99A','#F59E0B'];
  for(let i=0;i<30;i++){
    const e=document.createElement('i'), a=Math.random()*Math.PI*2, r=90+Math.random()*120;
    e.style.background=cols[i%cols.length];
    e.style.setProperty('--x',(Math.cos(a)*r).toFixed(0)+'px');
    e.style.setProperty('--y',(Math.sin(a)*r*0.8+60).toFixed(0)+'px');
    e.style.setProperty('--r',(Math.random()*540-270).toFixed(0)+'deg');
    e.style.animationDelay=(Math.random()*0.12).toFixed(2)+'s';
    c.appendChild(e);
  }
  document.body.appendChild(c); setTimeout(()=>c.remove(),1800);
}

function addWater(n){
  const before=waterToday(); S.waterLog[today()]=Math.max(0,before+n);
  const keys=Object.keys(S.waterLog).sort(); if(keys.length>90) keys.slice(0,keys.length-90).forEach(k=>delete S.waterLog[k]);
  save(); if(n>0) Haptic.light();
  if(before<S.water.goal && waterToday()>=S.water.goal){ toast('وصلت لهدف الماء اليوم'); Haptic.success(); }
  updateWidget(); reschedule();
}

  if(screen==='session') return;
  if(screen==='done'){ renderTabs(); return renderDone(); }
  screen='tabs'; renderTabs();
  ({home:renderHome,prog:renderProg,learn:renderLearn,set:renderSettings})[tab]();
}

/* ============ التهيئة (Onboarding) ============ */
let ob={step:0,goals:new Set(S.goals),q:[null,null,null],flip:{}};
function renderOnb(){
  const N=6, st=ob.step;
  const bar='<div class="steps">'+Array.from({length:N},(_,i)=>`<i class="${i<=st?'on':''}"></i>`).join('')+'</div>';
  let h='';
  if(st===0){
    h=`<div style="height:6vh"></div>${ILL.pelvis}<h1>قوة الحوض</h1>
    <p class="muted">برنامج مقنّن لتمارين كيجل مدته 180 يومًا. مدرّب موقّت يخبرك متى تضغط ومتى تسترخي — والاهتزاز يقودك والهاتف في جيبك.</p>
    <div class="card small"><b>خصوصية كاملة:</b> لا حساب، لا إعلانات، كل بياناتك على جهازك فقط.</div>
    <button class="btn accent" id="nx">ابدأ رحلتك</button>${CREDIT}`;
  } else if(st===1){
    const G=[['bladder','تحسين السيطرة على المثانة'],['recovery','دعم التعافي (بعد جراحة أو ولادة)'],['sexual','تحسين الأداء الجنسي'],['fitness','لياقة عامة']];
    h=`<h1>ما هدفك؟</h1><p class="muted">اختر واحدًا أو أكثر — نخصص رسائل التحفيز على أساسه.</p>`+
      G.map(([k,n])=>`<button class="opt ${ob.goals.has(k)?'on':''}" data-g="${k}"><span class="box"></span>${n}</button>`).join('')+
      `<div style="height:12px"></div><button class="btn accent" id="nx" ${ob.goals.size?'':'disabled style="opacity:.5"'}>التالي</button>`;
  } else if(st===2){
    const C=[
      ['طريقة إيقاف البول','أثناء التبول حاول إيقاف التدفق في منتصفه — العضلات التي تشدّها هي المطلوبة.<br><b style="color:var(--danger)">للتعرّف فقط — لا تتمرّن أثناء التبول بانتظام.</b>'],
      ['طريقة منع الغازات','تخيّل أنك تمنع خروج الغازات، واضغط العضلات المسؤولة عن ذلك دون شدّ البطن.'],
      ['علامات الانقباض الصحيح','للرجال: ارتفاع خفيف في الخصيتين وانسحاب بسيط للقضيب.<br>للنساء: إحساس بشدّ ورفع للداخل في فتحة المهبل.']
    ];
    h=`<h1>أين عضلاتك؟</h1><p class="muted">أهم خطوة: أن تعرف العضلة الصحيحة. اضغط كل بطاقة لقلبها.</p>${ILL.pelvis}`+
      C.map(([t,b],i)=>`<div class="flip ${ob.flip[i]?'on':''}" data-f="${i}"><div class="in"><div class="f"><h3>${i+1}. ${t}</h3><p class="muted small">اضغط للقراءة</p></div><div class="b"><p>${b}</p></div></div></div>`).join('')+
      `${ILL.sit}<div class="warn">للتأكد: تنفّس بحرية، ولا تشدّ بطنك أو فخذيك أو أردافك. إن انقبضت هذه فأنت تضغط خطأ.</div>
      <button class="btn accent" id="nx">فهمت، التالي</button>`;
  } else if(st===3){
    const Q=[['هل أدّيت تمارين كيجل من قبل؟',['لا، أول مرة','نعم، أحيانًا','نعم، بانتظام']],
             ['هل تستطيع شدّ العضلة دون شدّ البطن؟',['لست متأكدًا','غالبًا','نعم بسهولة']],
             ['هل لديك ألم حوض مزمن أو أعراض بولية مزمنة أو جراحة حديثة؟',['لا','نعم']]];
    h=`<h1>مستوى البداية</h1><p class="muted">ثلاثة أسئلة لنحدد من أين تبدأ.</p>`+
      Q.map(([q,o],i)=>`<div class="card"><h3>${q}</h3>`+o.map((x,j)=>`<button class="opt ${ob.q[i]===j?'on':''}" data-q="${i}" data-a="${j}"><span class="box"></span>${x}</button>`).join('')+`</div>`).join('')+
      `<button class="btn accent" id="nx" ${ob.q.every(x=>x!==null)?'':'disabled style="opacity:.5"'}>التالي</button>`;
  } else if(st===4){
    const lvl=calcLevel();
    h=`<h1>تنبيه مهم</h1>
    ${ob.q[2]===1?'<div class="warn"><b>ننصحك باستشارة طبيب قبل البدء.</b> ذكرت أعراضًا مزمنة أو جراحة حديثة — قد تحتاج تمارين بإشراف أخصائي علاج طبيعي لقاع الحوض.</div>':''}
    <div class="card"><p>هذا التطبيق أداة لياقة عامة وليس منتجًا طبيًا، ولا يشخّص أو يعالج أي حالة. إن كنت تعاني ألمًا في الحوض، أعراضًا بولية مزمنة، أو خضعت لجراحة حديثة، استشر طبيبًا قبل البدء. <b>توقف فورًا إذا شعرت بألم أثناء التمرين.</b></p></div>
    <div class="card center"><p class="muted">ستبدأ من</p><h2 style="margin:4px 0">المستوى ${lvl} — اليوم ${[1,15,43][lvl-1]}</h2><p class="small muted">مرحلة «${phaseOf([1,15,43][lvl-1]).name}»</p></div>
    <button class="btn accent" id="nx">${ob.q[2]===1?'فهمت، أواصل بحذر':'فهمت، التالي'}</button>`;
  } else if(st===5){
    h=`<h1>مواعيد التذكير</h1><p class="muted">3 جلسات قصيرة موزعة على اليوم أفضل من جلسة واحدة طويلة: العضلة تتعب بسرعة وتحتاج راحة بين الجلسات، والتكرار المتباعد يرسّخ العادة.</p>
    ${ILL.pocket}
    <div class="card">${S.reminders.map((t,i)=>`<div class="set"><span>${['الصباح','الظهر','المساء'][i]}</span><input type="time" value="${t}" data-r="${i}"></div>`).join('')}</div>
    <div class="card"><div class="set"><span class="hrow">${ic('drop')} تذكير شرب الماء<br></span><button class="sw ${S.water.on?'on':''}" id="obW" aria-pressed="${S.water.on}"></button></div><p class="small muted" style="margin:6px 0 0">كل ساعتين من 8 صباحًا إلى 10 مساءً، بهدف 8 أكواب يوميًا.</p></div>
    <p class="small muted">ستصلك إشعارات على الجوال في هذه الأوقات. يمكنك تعديلها لاحقًا من الإعدادات.</p>
    <button class="btn accent" id="nx">تفعيل التذكيرات والبدء</button>
    <div style="height:8px"></div><button class="btn ghost" id="skipN">البدء بدون تذكيرات</button>`;
  }
  app.innerHTML=bar+h;
  app.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{ const k=b.dataset.g; ob.goals.has(k)?ob.goals.delete(k):ob.goals.add(k); renderOnb(); });
  app.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{ ob.flip[b.dataset.f]=!ob.flip[b.dataset.f]; b.classList.toggle('on'); });
  app.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{ ob.q[+b.dataset.q]=+b.dataset.a; renderOnb(); });
  app.querySelectorAll('[data-r]').forEach(inp=>inp.onchange=()=>{ S.reminders[+inp.dataset.r]=inp.value; save(); });
  const nx=$('#nx'); if(nx) nx.onclick=()=>{ if(nx.disabled) return; if(st<5){ ob.step++; renderOnb(); window.scrollTo(0,0);} else finishOnb(true); };
  const sk=$('#skipN'); if(sk) sk.onclick=()=>finishOnb(false);
  const ow=$('#obW'); if(ow) ow.onclick=()=>{ S.water.on=!S.water.on; save(); renderOnb(); };
}
function calcLevel(){ const s=(ob.q[0]||0)+(ob.q[1]||0); if(ob.q[2]===1) return 1; return s>=4?3:s>=2?2:1; }
async function finishOnb(withRem){
  S.goals=[...ob.goals]; S.level=calcLevel(); S.progDay=[1,15,43][S.level-1]; S.warned=ob.q[2]===1;
  S.onboarded=true; S.remindersOn=withRem; S.startDate=today(); save();
  if(withRem){ const p=await notifPermission(); if(p==='denied') toast('لم يُسمح بالإشعارات — فعّلها من إعدادات الجوال'); await scheduleReminders(); }
  tab='home'; render();
}

/* ============ الرئيسية ============ */
function renderHome(){
  const plan=planFor(S.progDay), done=dailyDoneOn(today()), dayDone=S.dayDoneOn===today();
  const st=streak(), last=lastActiveBeforeToday(), gap=last?dayDiff(last,today()):0;
  const h=new Date().getHours(), greet=h<12?'صباح الخير':h<18?'مساء الخير':'مساء النور';
  const idx=Math.min(done,plan.n-1);
  let main;
  if(dayDone){
    main=`<div class="card center"><span class="ic-badge" style="width:56px;height:56px;border-radius:18px">${ic('checkCircle','lg')}</span><h2 style="margin:6px 0">اكتمل اليوم</h2>
      <p class="muted">أكملت ${plan.n} من ${plan.n} جلسات. نراك غدًا في اليوم ${Math.min(180,S.progDay+1)}.</p>
      <button class="btn ghost" id="extra">جلسة إضافية اختيارية</button></div>`;
  } else {
    const p=plan.patterns[idx];
    main=`<div class="card">
      <div class="row" style="justify-content:space-between"><span class="chip">${PAT_NAME[p]}</span><span class="small muted hrow" style="justify-content:flex-end">${ic('clock')} ~${sessionMinutes(plan,idx)} د</span></div>
      <h2 style="margin:12px 0 4px">جلسة ${idx+1} من ${plan.n}</h2>
      <p class="muted">${sessDesc(plan,p)}</p>${wave(p)}
      <div class="row small muted" style="margin:10px 0 6px"><span>تقدّم اليوم</span><span style="text-align:left">${done}/${plan.n}</span></div>
      <div class="pbar"><i style="width:${done/plan.n*100}%"></i></div>
      <div style="height:14px"></div><button class="btn" id="go">${ic('play')}ابدأ الجلسة</button></div>`;
  }
  const recover = (!dayDone && gap>=2 && last) ? `<div class="card" style="border-color:var(--accent)"><h3 class="hrow">${ic('comeback')} سلسلتك تنتظرك</h3><p class="muted small">غبت ${gap-1} ${gap-1===1?'يومًا':'أيام'} — لا بأس. دقيقة واحدة تكفي للعودة.</p><button class="btn accent sm" id="qBack">جلسة عودة سريعة</button></div>`:'';
  const adv = S.suggestAdvance && !dayDone ? `<div class="card"><h3 class="hrow">${ic('arrowUp')} تبدو مستعدًا للتقدّم</h3><p class="small muted">قيّمت جلساتك الأخيرة بأنها سهلة. هل تريد التقدّم يومًا في البرنامج؟</p><div class="row"><button class="btn accent sm" id="advY">نعم، تقدّم</button><button class="btn ghost sm" id="advN">لاحقًا</button></div></div>`:'';
  app.innerHTML=`
    <div class="topbar"><div><p class="muted" style="margin:0">${greet}</p><h1>اليوم ${S.progDay} <span class="muted" style="font-size:16px">من 180</span></h1></div>
    <span class="chip">${plan.light?'أسبوع خفيف · ':''}${plan.phase.name}</span></div>
    ${S.progDay>=180?'<div class="warn">وصلت لنهاية البرنامج — استمر بجلسات الصيانة يوميًا.</div>':''}
    ${recover}${adv}${main}
    <div class="row"><div class="card stat"><b class="hrow" style="justify-content:center">${st} <span class="flame">${ic('flame','lg')}</span></b><span class="small muted">السلسلة الحالية</span></div>
    <div class="card stat"><b>${totalSessions()}</b><span class="small muted">إجمالي الجلسات</span></div></div>
    ${S.water.on?`<div class="card"><div class="row" style="justify-content:space-between"><h3 class="hrow" style="margin:0">${ic('drop')} الماء اليوم</h3><b style="text-align:left">${waterToday()} من ${S.water.goal} أكواب</b></div>
      ${cupsSVG(Math.min(waterToday(),S.water.goal),S.water.goal)}
      <div class="row"><button class="btn ghost sm" id="wMinus" aria-label="إنقاص كوب" style="flex:0 0 56px;min-width:56px">−</button><button class="btn accent sm" id="wPlus">${ic('drop')}أضف كوبًا</button></div>
      <p class="small muted" style="margin-bottom:0">${waterToday()>=S.water.goal?'أحسنت، وصلت لهدفك اليوم.':'شربت '+(waterToday()*S.water.ml/1000).toFixed(2).replace(/\.?0+$/,'')+' لتر من '+(S.water.goal*S.water.ml/1000)+' لتر'}</p></div>`:''}
    <h2>تمارين سريعة</h2>
    <div class="row"><button class="card" id="q1" style="text-align:start;margin:0"><span class="ic-badge">${ic('bolt')}</span><h3>جلسة سريعة</h3><p class="small muted">دقيقة واحدة — تحفظ سلسلة يومك</p></button>
    <button class="card" id="q2" style="text-align:start;margin:0"><span class="ic-badge">${ic('flame')}</span><h3>النيران السريعة</h3><p class="small muted">60 ثانية: ضغط وإرخاء كل ثانية</p></button></div>`;
  const go=$('#go'); if(go) go.onclick=()=>startSession('daily',plan,idx);
  const ex=$('#extra'); if(ex) ex.onclick=()=>startSession('quick');
  const qb=$('#qBack'); if(qb) qb.onclick=()=>startSession('quick');
  $('#q1').onclick=()=>startSession('quick'); $('#q2').onclick=()=>startSession('rapidq');
  const wp=$('#wPlus'); if(wp) wp.onclick=()=>{ addWater(1); render(); };
  const wm=$('#wMinus'); if(wm) wm.onclick=()=>{ if(waterToday()>0){ addWater(-1); render(); } };
  const ay=$('#advY'); if(ay) ay.onclick=()=>{ if(S.progDay<180) S.progDay++; S.suggestAdvance=false; save(); toast('تقدّمت إلى اليوم '+S.progDay); render(); };
  const an=$('#advN'); if(an) an.onclick=()=>{ S.suggestAdvance=false; save(); render(); };
}
function sessDesc(plan,p){
  if(p==='classic') return `${plan.reps} تكرارات · ضغط ${plan.sq} ث / إرخاء ${plan.rl} ث`;
  if(p==='steps') return `سلّم تصاعدي 1→2→3→2→1 ث · ${Math.max(3,Math.ceil(plan.reps/2))} جولات`;
  if(p==='rapid') return '30 انقباضة سريعة: ثانية ضغط وثانية إرخاء';
  if(p==='hold') return `3 انقباضات ثبات طويل · ${plan.holdSec} ث لكل واحدة`;
  if(p==='elevator') return `المصعد: نصف ضغط ← ضغط كامل ← أقصى ضغط · ${Math.max(4,Math.round(plan.reps/2))} جولات`;
  return '';
}

/* ============ محرك الجلسة ============ */
let R=null;
const PH={
  ready:['استعد','اجلس أو استلقِ براحة، وتنفّس بهدوء.'],
  sq:['اضغط الآن','شدّ كأنك توقف تدفق البول، وارفع للداخل.'],
  hold:['استمر بالضغط','حافظ على الانقباض وتنفّس بحرية — لا تحبس نفسك.'],
  rl:['استرخِ تمامًا','أرح العضلة كاملًا — الراحة جزء من التمرين.'],
  e1:['الطابق الأول','نصف ضغط خفيف.'],e2:['الطابق الثاني','زِد إلى ضغط كامل.'],e3:['الطابق الأعلى','أقصى ضغط ممكن… ثم انزل ببطء.']
};
function startSession(kind,plan,idx){
  plan=plan||planFor(S.progDay);
  const s=buildSession(kind,plan,idx||0);
  R={s,i:0,e:0,elapsed:0,paused:false,last:performance.now(),lastSec:null,timer:null,startedAt:Date.now()};
  screen='session'; renderTabs(); keepAwake(true);
  drawSession(); enterStep();
  R.timer=setInterval(tick,100);
}
function curLabel(st){ if(st.t==='sq'&&st.lbl==='hold') return PH.hold; return PH[st.t]; }
function enterStep(){
  const st=R.s.steps[R.i];
  if(st.t==='sq'||st.t==='e1'){ Haptic.heavy(); }
  else if(st.t==='rl'){ Haptic.double(); }
  else if(st.t==='e2'||st.t==='e3'){ Haptic.heavy(); }
  if(st.d>=2) speak(curLabel(st)[0]);
  R.lastSec=null; updateSession(true);
  const rw=document.querySelector('.ring-wrap'); if(rw && st.t!=='ready'){ rw.classList.remove('beat'); void rw.offsetWidth; rw.classList.add('beat'); }
}
function tick(){
  if(!R||R.paused) { if(R) R.last=performance.now(); return; }
  const now=performance.now(), dt=(now-R.last)/1000; R.last=now;
  R.e+=dt; R.elapsed+=dt;
  const st=R.s.steps[R.i];
  if(R.e>=st.d){
    // نهاية التكرار؟
    const next=R.s.steps[R.i+1];
    if(st.t==='rl' && (!next || next.rep!==st.rep)) Haptic.success();
    R.e-=st.d; R.i++;
    if(R.i>=R.s.steps.length){ return finishSession(false); }
    enterStep(); return;
  }
  const rem=Math.ceil(st.d-R.e);
  if(rem!==R.lastSec){ R.lastSec=rem; if(st.d>2 && rem<=2 && rem>0 && st.t!=='ready') Haptic.light(); }
  updateSession(false);
}
function drawSession(){
  const C=2*Math.PI*96;
  app.innerHTML=`
  <div class="topbar"><button class="iconbtn" id="xBtn" aria-label="خروج">${ic('x')}</button>
    <div class="center"><b id="sTitle" class="small">${R.s.title}</b><div class="small muted" id="repTxt"></div></div>
    <button class="iconbtn" id="vBtn" aria-label="الصوت">${ic(S.voice?'volOn':'volOff')}</button></div>
  <div class="ring-wrap"><svg width="240" height="240" viewBox="0 0 240 240">
    <circle cx="120" cy="120" r="96" fill="none" stroke="var(--line)" stroke-width="10"/>
    <circle id="ring" cx="120" cy="120" r="96" fill="none" stroke="var(--accent)" stroke-width="10" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C}"/></svg>
    <div class="ring-center"><div class="count" id="cnt">3</div><div class="small muted">ثانية</div></div></div>
  ${liveHammock()}
  <div class="phase" id="ph">استعد</div><p class="hint" id="hint"></p>
  <div class="dots" id="dots"></div>
  <div class="pbar" style="margin:8px 0 16px"><i id="tot" style="width:0"></i></div>
  <div class="row"><button class="btn" id="pBtn">${ic('pause')}إيقاف مؤقت</button><button class="btn ghost" id="sBtn">تخطّي الجلسة</button></div>
  <p class="small muted center hrow" style="margin-top:14px;justify-content:center">${ic('bulb')} ضع الهاتف في جيبك: نبضة قوية = اضغط · نبضتان = استرخِ</p>`;
  $('#pBtn').onclick=togglePause;
  $('#xBtn').onclick=()=>askExit();
  $('#sBtn').onclick=()=>askExit(true);
  $('#vBtn').onclick=()=>{ S.voice=!S.voice; save(); $('#vBtn').innerHTML=ic(S.voice?'volOn':'volOff'); };
}
function updateSession(full){
  const st=R.s.steps[R.i], C=2*Math.PI*96;
  let frac=Math.min(1,R.e/st.d);
  let fill = st.t==='rl' ? 1-frac : st.t==='ready' ? 0 :
             st.t==='e1' ? frac/3 : st.t==='e2' ? 1/3+frac/3 : st.t==='e3' ? 2/3+frac/3 : frac;
  const ring=$('#ring'); if(!ring) return;
  ring.setAttribute('stroke-dashoffset', C*(1-fill));
  ring.setAttribute('stroke', st.t==='rl'?'var(--relax)':'var(--accent)');
  $('#cnt').textContent=Math.max(1,Math.ceil(st.d-R.e));
  const sag=Math.round(84-fill*52), H=$('#lvH'), O=$('#lvO');
  if(H){ const d=`M36 44 Q130 ${sag} 224 44`; H.setAttribute('d',d); H.style.d=`path("${d}")`; H.setAttribute('stroke',st.t==='rl'||st.t==='ready'?'var(--relax)':'var(--accent)'); }
  if(O) O.style.transform=`translateY(${(-fill*14).toFixed(1)}px)`;
  $('#tot').style.width=(R.elapsed/R.s.total*100)+'%';
  if(full){
    const L=curLabel(st);
    $('#ph').textContent=L[0]; $('#ph').style.color=st.t==='rl'?'var(--muted)':'var(--accent)';
    $('#hint').textContent=L[1];
    const rep=st.rep||0, n=R.s.reps;
    $('#repTxt').textContent= rep? `تكرار ${rep} من ${n}` : '';
    $('#dots').innerHTML = n<=15 ? Array.from({length:n},(_,k)=>`<i class="${k+1<rep?'on':k+1===rep?'cur':''}"></i>`).join('') : '';
  }
}
function togglePause(force){
  if(!R) return;
  R.paused = typeof force==='boolean' ? force : !R.paused;
  R.last=performance.now();
  const b=$('#pBtn'); if(b) b.innerHTML=R.paused?ic('play')+'استئناف':ic('pause')+'إيقاف مؤقت';
  if(R.paused){ $('#ph').textContent='متوقف مؤقتًا'; try{speechSynthesis.cancel();}catch(e){} } else updateSession(true);
}
function askExit(isSkip){
  if(!R) return;
  const wasPaused=R.paused; togglePause(true);
  const pct=R.elapsed/R.s.total;
  const partial = pct>=0.6;
  modal(`<h3>${isSkip?'تخطّي هذه الجلسة؟':'الخروج من الجلسة؟'}</h3>
    <p class="muted small">${partial?'أنجزت '+Math.round(pct*100)+'% من الجلسة — يمكنك احتسابها مكتملة.':'ستفقد تقدّم هذه الجلسة. الجلسة المتخطاة لا تكسر السلسلة لكنها لا تُحسب.'}</p>
    ${partial?'<button class="btn accent" id="mCount">احسب ما أنجزته</button><div style="height:8px"></div>':''}
    <button class="btn ${partial?'ghost':''}" id="mExit">${isSkip?'تخطّي':'خروج'}</button><div style="height:8px"></div>
    <button class="btn ghost" id="mStay">متابعة التمرين</button>`,
  (m,close)=>{
    m.querySelector('#mStay').onclick=()=>{ close(); if(!wasPaused) togglePause(false); };
    m.querySelector('#mExit').onclick=()=>{ close(); endSession(isSkip?'skip':'quit'); };
    const c=m.querySelector('#mCount'); if(c) c.onclick=()=>{ close(); finishSession(true); };
  });
}
function stopEngine(){ if(R&&R.timer) clearInterval(R.timer); keepAwake(false); try{speechSynthesis.cancel();}catch(e){} }
function endSession(how){
  stopEngine();
  if(how==='skip' && R.s.kind==='daily'){ S.logs.push({date:today(),ts:Date.now(),kind:'daily',skipped:true,pattern:R.s.pattern,reps:0,dur:0}); save(); toast('تم تخطّي الجلسة'); }
  R=null; screen='tabs'; render();
}
let lastDone=null;
function finishSession(partial){
  stopEngine();
  const s=R.s, repsDone = partial ? (R.s.steps[R.i].rep||s.reps) : s.reps;
  const gapBefore = (()=>{ const l=lastActiveBeforeToday(); return l?dayDiff(l,today()):0; })();
  const log={date:today(),ts:Date.now(),kind:s.kind,pattern:s.pattern,reps:repsDone,dur:Math.round(R.elapsed),partial:!!partial};
  S.logs.push(log);
  if(s.kind==='daily'){
    const plan=planFor(S.progDay);
    if(dailyDoneOn(today())>=plan.n){ S.dayDoneOn=today(); log.dayComplete=true; if(S.progDay===plan.phase.to){ S.phDone=S.phDone||{}; S.phDone[plan.phase.n]=1; } }
  }
  if(gapBefore>=4) S.comeback=true;
  if(S.logs.length>3000) S.logs=S.logs.slice(-3000);
  save(); Haptic.long(); updateWidget();
  lastDone={log,fresh:checkAch(),first:totalSessions()===1};
  R=null; screen='done'; render(); scheduleReminders();
}
document.addEventListener('visibilitychange',()=>{
  if(document.hidden && R && !R.paused){ togglePause(true); }
});

/* ============ شاشة الإنجاز ============ */

  app.innerHTML=`<div class="big-check"><svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path pathLength="1" d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
  <h1 class="center">أحسنت! ${log.partial?'احتُسبت الجلسة':'جلسة مكتملة'}</h1>

  ${log.dayComplete?'<div class="card center"><b>اكتمل اليوم '+S.progDay+'</b><p class="small muted">الجلسات موزعة على اليوم عمدًا — نراك غدًا.</p></div>':''}
  <div class="card center"><b class="hrow" style="font-size:22px;justify-content:center">${st} <span class="flame">${ic('flame','lg')}</span></b><p class="small muted">أيام متتالية</p></div>
  ${fresh.length?'<div class="card"><h3>إنجاز جديد!</h3>'+fresh.map(([e,n])=>'<p class="hrow"><span class="ic-badge" style="margin:0">'+achIc(e)+'</span>'+n+'</p>').join('')+'</div>':''}
  ${first?'<div class="card"><h3 class="hrow">'+ic('sprout')+' بداية رائعة</h3><p class="small muted">أكملت أول جلسة. البرنامج الكامل 180 يومًا يتدرّج معك خطوة بخطوة — استمر 3 جلسات يوميًا.</p></div>':''}
  <div class="card"><h3>كيف كانت الجلسة؟</h3><div class="rate">
    <button data-r="easy">سهلة</button><button data-r="ok">مناسبة</button><button data-r="hard">صعبة</button></div></div>
  <button class="btn" id="home">العودة للرئيسية</button>`;
  app.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{
    log.rating=b.dataset.r; app.querySelectorAll('[data-r]').forEach(x=>x.classList.toggle('on',x===b));
    evalAdvance(); save();
    if(b.dataset.r==='hard') toast('لا بأس — إن تكررت الصعوبة خذ وقتك، وتوقف إن شعرت بألم.');
  });
  setTimeout(confetti,150);
  $('#home').onclick=()=>{ screen='tabs'; tab='home'; render(); window.scrollTo(0,0); };
}
function evalAdvance(){
  // 3 أيام متتالية مختلفة بتقييم «سهلة» لآخر جلسة يومية في كل يوم
  const byDay={};
  S.logs.filter(l=>l.kind==='daily'&&!l.skipped&&l.rating).forEach(l=>byDay[l.date]=l.rating);
  const days=Object.keys(byDay).sort().slice(-3);
  if(days.length===3 && days.every(d=>byDay[d]==='easy') && dayDiff(days[0],days[2])===2) S.suggestAdvance=true;
}

function renderProg(){
  const plan=planFor(S.progDay);
  const last7=Array.from({length:7},(_,i)=>addDays(today(),i-6));

  app.innerHTML=`<h1>تقدّمك</h1>
  <div class="card"><div class="row" style="justify-content:space-between"><h3>هذا الأسبوع</h3><b style="text-align:left">${Math.min(weekDone,weekGoal)}/${weekGoal}</b></div>

  <div class="card"><h3>آخر 7 أيام</h3>

  '<div class="bars">'+last7.map((d,i)=>`<div><small>${counts[i]||''}</small><span class="${counts[i]?'':'zero'}" style="height:${Math.max(3,counts[i]/max*100)}%"></span><small>${AR_DAYS[new Date(d+'T12:00').getDay()]}</small></div>`).join('')+'</div>'}</div>

  <div class="card"><h3>المرحلة الحالية: ${plan.phase.name}</h3><p class="small muted">${plan.phase.goal} · الأيام ${plan.phase.from}–${plan.phase.to}</p>

}

  ['الماء وصحة المثانة',`<p><b>لا تقلّل الماء لتقليل التسرّب.</b> البول المركّز يهيّج المثانة ويزيد الإلحاح، والقليل من الماء يسبب الإمساك الذي يضغط على قاع الحوض.</p><p><b>وزّع الشرب على اليوم:</b> كوب كل ساعة أو ساعتين أفضل من كمية كبيرة مرة واحدة. لون البول الأصفر الفاتح علامة جيدة على الترطيب.</p><p><b>قلّل المهيّجات:</b> القهوة والشاي ومشروبات الطاقة والمشروبات الغازية تزيد الإلحاح عند كثير من الناس.</p><p><b>قبل النوم:</b> إن كنت تستيقظ للتبول، خفّف الشرب في آخر ساعتين قبل النوم، وعوّض ذلك نهارًا.</p><p class="small muted">من لديه مرض في القلب أو الكلى أو تعليمات طبية بتحديد السوائل يلتزم بتعليمات طبيبه.</p>`],
  ['متى أتوقف وأستشير طبيبًا؟','<p>توقف فورًا واستشر طبيبًا إذا شعرت بـ: ألم أثناء التمرين أو بعده، ألم في الحوض أو أسفل الظهر يزداد، تفاقم في أعراض البول، أو إذا لم تلاحظ أي تحسن بعد 3 أشهر من الالتزام. أخصائي العلاج الطبيعي لقاع الحوض يستطيع تقييم حالتك بدقة.</p>']
];
function renderLearn(){
  app.innerHTML=`<h1>تعلّم</h1><p class="muted">مقالات قصيرة تساعدك على التمرين الصحيح.</p>
  <div class="warn"><b class="hrow">${ic('alert')} تحذير طبي</b> هذا التطبيق أداة لياقة عامة وليس منتجًا طبيًا. إن كنت تعاني ألمًا في الحوض، أعراضًا بولية مزمنة، أو خضعت لجراحة حديثة، استشر طبيبًا قبل البدء. توقف فورًا إذا شعرت بألم.</div>
  ${ARTICLES.map(([t,b],i)=>`<details ${i===0?'open':''}><summary>${t}</summary><div>${typeof b==='function'?b():b}</div></details>`).join('')}
  ${CREDIT}`;
}

/* ============ الإعدادات ============ */
function renderSettings(){
  const sw=(k,on)=>`<button class="sw ${on?'on':''}" data-sw="${k}" aria-pressed="${on}"></button>`;
  app.innerHTML=`<h1>الإعدادات</h1>
  <h2>التذكيرات</h2><div class="card">
   <div class="set"><span>إشعارات مواعيد التمرين</span>${sw('remindersOn',S.remindersOn)}</div>
   ${S.reminders.map((t,i)=>`<div class="set"><span>${['جلسة الصباح','جلسة الظهر','جلسة المساء'][i]}</span><input type="time" value="${t}" data-r="${i}"></div>`).join('')}
   <div class="set"><span>التذكير الذكي<br><span class="small muted">يتعلّم أوقات تمرينك الفعلية ويذكّرك قبلها</span></span>${sw('smartRem',S.smartRem)}</div>
   ${S.smartRem?`<div class="set"><span class="small muted">المواعيد المستخدمة الآن</span><span class="small">${effectiveTimes().map(x=>x.t+(x.learned?'<span class="tag">متعلَّم</span>':'')).join('<br>')}</span></div>`:''}
   <div class="set"><span class="small muted">${isNative?'تُجدول على جوالك وتصلك حتى والتطبيق مغلق.':'الإشعارات تعمل في نسخة تطبيق الجوال.'}</span>${isNative?'<button class="btn ghost sm" id="testN">تجربة إشعار</button>':''}</div>
   ${isNative?'<div class="set"><span class="small muted">إن تأخرت الإشعارات: اسمح بـ«المنبهات والتذكيرات» للتطبيق.</span><button class="btn ghost sm" id="exact">فتح الإذن</button></div>':''}
  </div>
  <h2>شرب الماء</h2><div class="card">
   <div class="set"><span>تذكير شرب الماء</span><button class="sw ${S.water.on?'on':''}" id="wOn" aria-pressed="${S.water.on}"></button></div>
   <div class="set"><span>الهدف اليومي (أكواب)</span><select id="wGoal">${[4,5,6,7,8,9,10,11,12,14,16].map(n=>`<option ${n===S.water.goal?'selected':''}>${n}</option>`).join('')}</select></div>
   <div class="set"><span>حجم الكوب</span><select id="wMl">${[200,250,300,330,500].map(n=>`<option value="${n}" ${n===S.water.ml?'selected':''}>${n} مل</option>`).join('')}</select></div>
   <div class="set"><span>التذكير كل</span><select id="wEvery">${[[60,'ساعة'],[90,'ساعة ونصف'],[120,'ساعتين'],[180,'3 ساعات']].map(([v,n])=>`<option value="${v}" ${v===S.water.every?'selected':''}>${n}</option>`).join('')}</select></div>
   <div class="set"><span>من</span><input type="time" id="wFrom" value="${S.water.from}"></div>
   <div class="set"><span>إلى</span><input type="time" id="wTo" value="${S.water.to}"></div>
   <p class="small muted" style="margin:8px 0 0">تتوقف تذكيرات اليوم تلقائيًا عند بلوغ هدفك. وزّع الشرب على اليوم، وقلّل الماء قبل النوم بساعتين إن كنت تستيقظ ليلًا للتبول.</p>
  </div>
  <h2>ويدجت الشاشة الرئيسية</h2><div class="card"><p class="small" style="margin:0">اضغط مطولًا على مكان فارغ في الشاشة الرئيسية للجوال ← <b>الأدوات (Widgets)</b> ← ابحث عن <b>قوة الحوض</b> واسحبه للشاشة. يعرض سلسلتك وجلسات اليوم والماء، وتبدأ منه جلسة أو تضيف كوب ماء بلمسة.</p></div>
  <h2>التمرين</h2><div class="card">
   <div class="set"><span>الاهتزاز التوجيهي</span>${sw('haptics',S.haptics)}</div>
   <div class="set"><span>الإرشاد الصوتي</span>${sw('voice',S.voice)}</div>
   <div class="set"><span>تجربة أنماط الاهتزاز</span><button class="btn ghost sm" id="testV">جرّب</button></div>
  </div>
  <h2>المظهر</h2><div class="card"><div class="set"><span>الوضع الليلي</span>${sw('dark',S.dark)}</div></div>
  <h2>البرنامج</h2><div class="card">
   <div class="set"><span>اليوم الحالي</span><b>${S.progDay} / 180</b></div>
   <div class="set"><span>العودة يومًا للخلف</span><button class="btn ghost sm" id="back1">−1 يوم</button></div>
  </div>
  <h2>الخصوصية</h2><div class="card">
   <p class="small muted">كل بياناتك محفوظة على هذا الجهاز فقط. لا حسابات، لا إعلانات، ولا يُرسل أي شيء لأي خادم.</p>
   <button class="btn ghost" id="wipe" style="color:var(--danger)">حذف كل البيانات والبدء من جديد</button></div>
  <div class="warn small">هذا التطبيق أداة لياقة عامة وليس منتجًا طبيًا، ولا يشخّص أو يعالج أي حالة. استشر طبيبًا عند وجود ألم أو أعراض مزمنة أو جراحة حديثة. توقف فورًا إذا شعرت بألم.</div>
  <p class="center small muted" style="margin-bottom:0">قوة الحوض · الإصدار 1.0</p>${CREDIT}`;
  app.querySelectorAll('[data-sw]').forEach(b=>b.onclick=async()=>{
    const k=b.dataset.sw; S[k]=!S[k]; save();
    if(k==='remindersOn'){ if(S.remindersOn) await notifPermission(); await scheduleReminders(); toast(S.remindersOn?'تم تفعيل التذكيرات':'تم إيقاف التذكيرات'); }
    if(k==='voice'&&S.voice) speak('الإرشاد الصوتي مفعّل');
    if(k==='smartRem') reschedule();
    render();
  });
  app.querySelectorAll('[data-r]').forEach(inp=>inp.onchange=async()=>{ S.reminders[+inp.dataset.r]=inp.value; save(); await scheduleReminders(); toast('تم تحديث موعد التذكير'); });
  $('#wOn').onclick=async()=>{ S.water.on=!S.water.on; save(); if(S.water.on) await notifPermission(); reschedule(); toast(S.water.on?'تم تفعيل تذكير الماء':'تم إيقاف تذكير الماء'); render(); };
  [['wGoal','goal'],['wMl','ml'],['wEvery','every']].forEach(([id,k])=>$('#'+id).onchange=e=>{ S.water[k]=+e.target.value; save(); reschedule(); updateWidget(); });
  [['wFrom','from'],['wTo','to']].forEach(([id,k])=>$('#'+id).onchange=e=>{ if(e.target.value){ S.water[k]=e.target.value; save(); reschedule(); } });
  $('#testV').onclick=()=>{ const was=S.haptics; S.haptics=true; Haptic.heavy(); setTimeout(()=>Haptic.double(),1200); setTimeout(()=>Haptic.light(),2400); setTimeout(()=>Haptic.long(),3600); S.haptics=was; toast('قوية = اضغط · نبضتان = استرخِ · خفيفة = آخر ثانيتين · ممتدة = انتهت'); };
  $('#back1').onclick=()=>{ if(S.progDay>1){ S.progDay--; S.dayDoneOn=null; save(); render(); } };
  const tn=$('#testN'); if(tn) tn.onclick=async()=>{ await notifPermission(); try{ await LN.createChannel({id:'training',name:'تذكير التمارين',importance:5,vibration:true}); }catch(e){} await LN.schedule({notifications:[{id:9,title:'تجربة إشعار',body:'هكذا ستصلك تذكيرات التمرين.',schedule:{at:new Date(Date.now()+5000),allowWhileIdle:true},channelId:'training',smallIcon:'ic_stat_notify'}]}); toast('سيصلك إشعار تجريبي بعد 5 ثوانٍ'); };
  const ex=$('#exact'); if(ex) ex.onclick=async()=>{ try{ await LN.changeExactNotificationSetting(); }catch(e){ toast('غير متاح على هذا الجهاز'); } };
  $('#wipe').onclick=()=>modal(`<h3>حذف كل البيانات؟</h3><p class="muted small">سيُحذف تقدّمك وإنجازاتك وسجلّك نهائيًا من هذا الجهاز.</p><button class="btn" id="yes" style="background:var(--danger);color:#fff">نعم، احذف</button><div style="height:8px"></div><button class="btn ghost" id="no">إلغاء</button>`,
    (m,close)=>{ m.querySelector('#no').onclick=close; m.querySelector('#yes').onclick=async()=>{ close(); S=Object.assign({},DEF,{logs:[],ach:{},reminders:['07:00','13:00','21:00'],water:defWater(),waterLog:{}}); ob={step:0,goals:new Set(),q:[null,null,null],flip:{}}; save(); if(LN){ try{const p=await LN.getPending(); if(p.notifications.length) await LN.cancel({notifications:p.notifications.map(n=>({id:n.id}))});}catch(e){} } render(); }; });
}

/* ============ زر الرجوع في أندرويد ============ */
if(APP){
  APP.addListener('backButton',()=>{
    const m=document.querySelector('.modal'); if(m){ m.remove(); return; }
    if(screen==='session'){ askExit(); return; }
    if(screen==='done'){ screen='tabs'; tab='home'; render(); return; }
    if(!S.onboarded && ob.step>0){ ob.step--; render(); return; }
    if(tab!=='home'){ tab='home'; render(); return; }
    APP.exitApp();
  });
  APP.addListener('resume',()=>{ rollover(); if(screen!=='session') render(); scheduleReminders(); });
  APP.addListener('appUrlOpen',e=>handleUrl(e&&e.url));
  try{ APP.getLaunchUrl().then(r=>{ if(r&&r.url) setTimeout(()=>handleUrl(r.url),300); }).catch(()=>{}); }catch(e){}
}
if(LN){
  LN.addListener('localNotificationActionPerformed',a=>{
    const go=a&&a.notification&&a.notification.extra&&a.notification.extra.go;
    if(go==='water'){ if(a.actionId==='drink') addWater(1); if(screen!=='session'){ screen='tabs'; tab='home'; render(); } }
    else if(go==='session'){ if(a.actionId==='start' && screen!=='session') startNext(); else if(screen!=='session'){ screen='tabs'; tab='home'; render(); } }
  });
}

/* ============ تشغيل ============ */
rollover(); render();
if(S.onboarded) scheduleReminders();
setInterval(()=>{ if(screen==='tabs'){ const before=S.progDay, bd=S.dayDoneOn; rollover(); if(before!==S.progDay||bd!==S.dayDoneOn) render(); } },60000);
</script>
</body>
</html>
